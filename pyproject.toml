[project]
name = "web-cli"
version = "0.3.1"
description = "Minimalist agent-optimized CLI driving the running Chrome over CDP."
requires-python = ">=3.11"
dependencies = ["websockets>=13", "rich>=13"]

[project.scripts]
web-cli = "web_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_cli"]
