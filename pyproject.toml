[project]
name = "web-cli"
version = "0.8.0"
description = "Minimalist agent-optimized CLI driving the running Chrome over CDP."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["websockets>=13", "rich>=13"]

[project.scripts]
web-cli = "web_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_cli"]
